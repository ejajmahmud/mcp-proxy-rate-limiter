[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-proxy-rate-limiter"
version = "0.1.0"
description = "Sliding-window token bucket rate limiter and backoff coordinator for MCP endpoints"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-proxy-rate-limiter = "mcp_proxy_rate_limiter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_proxy_rate_limiter*"]
